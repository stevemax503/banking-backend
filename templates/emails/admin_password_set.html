<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td>
      <p
        style="
          margin: 0 0 8px;
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: {{ accent_color }};
        "
      >
        Password updated
      </p>
      <h1 style="margin: 0 0 16px; font-size: 24px; font-weight: 700; color: {{ primary_color }}">
        Hi {{ user.full_name }},
      </h1>
      <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.65; color: #4b5563">
        A SafaPay administrator set a new password for your account. Use it to sign in, then change it in Settings if you want.
      </p>
    </td>
  </tr>
  <tr>
    <td
      style="
        background-color: #fafafa;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 14px 16px;
      "
    >
      <p style="margin: 0 0 8px; font-size: 12px; font-weight: 600; color: #6b7280">Your new password</p>
      <p style="margin: 0; font-size: 16px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; word-break: break-all; color: {{ primary_color }}">{{ new_password }}</p>
    </td>
  </tr>
  <tr>
    <td style="padding-top: 20px">
      <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #6b7280">
        If you did not expect this change, contact support immediately.
      </p>
    </td>
  </tr>
</table>
